name: CI/CD for Java App
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # Use self-hosted if Tomcat is on the same server
    # runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'
      - name: Build with Maven
        run: mvn clean install -f MyWebApp/pom.xml
      - name: Deploy to Tomcat
        run: |
          curl -v -u ${{ secrets.tomcat_user }}:${{ secrets.tomcat_password }} \
          -T MyWebApp/target/MyWebApp.war \
          "http://${{ secrets.tomcat_host }}/manager/text/deploy?path=/MyWebApp&update=true"
